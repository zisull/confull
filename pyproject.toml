[tool.poetry]
name = "confull"
version = "0.2.0"
description = "一个简单的配置管理工具(A simple dictionary configuration management tool),dict <-> config file [json, toml, yaml, ini, xml]"
authors = ["zisul <zisull@qq.com>"]
readme = "README.md"
packages = [{ include = "confull" }]
license = "MIT"
keywords = ["configuration", "toml", "yaml", "json", "ini", "xml"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]

[tool.poetry.dependencies]
python = "^3.9"
orjson = "^3.10.11"
toml = "^0.10.2"          # 默认格式，必装
PyYAML = { version = "^6.0.2", optional = true }
watchdog = { version = "^6.0.0", optional = true }
portalocker = { version = "^3.0.0", optional = true }
cryptography = { version = "^42.0.0", optional = true }

[tool.poetry.extras]
yaml = ["PyYAML"]
watch = ["watchdog"]
process = ["portalocker"]
encrypt = ["cryptography"]
all = ["PyYAML", "watchdog", "portalocker", "cryptography"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.mypy]
python_version = "3.8"
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "confull.config"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["orjson", "toml", "yaml", "portalocker", "watchdog", "cryptography.*"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"